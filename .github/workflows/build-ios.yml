name: Build iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Generate iOS icons
        run: dart run flutter_launcher_icons -f flutter_launcher_icons_ios.yaml

      - name: Patch platform files
        run: dart run tool/patch_platforms.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=THAMAN_SUPABASE_URL=https://bbmeefjtzszysgttryie.supabase.co \
            --dart-define=THAMAN_SUPABASE_PUBLISHABLE_KEY=sb_publishable_oqYfMj4kN4D2IN_3rIKQow_9sH9FUt6

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: thaman-pos-ios
          path: build/ios/iphoneos/
